<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사고도구 톡톡 — 반응형 학습지</title>
  <meta name="description" content="초등 사고 전략 기법 활동지 웹 플랫폼" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: "Pretendard", "Noto Sans KR", ui-sans-serif, system-ui, sans-serif; background-color: #f8fafc; color: #1e293b; }
    .hex-cell { width: 80px; height: 70px; clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
    @media (min-width: 640px) { .hex-cell { width: 100px; height: 86px; } }
    .input-base { width: 100%; border-radius: 0.25rem; border: 1px solid #e2e8f0; background: #fff; padding: 0.375rem 0.75rem; font-size: 0.875rem; }
    .input-base:focus { border-color: #60a5fa; outline: none; box-shadow: 0 0 0 1px #60a5fa; }
    .input-base:disabled { background: #f8fafc; }
    .textarea-base { min-height: 80px; width: 100%; resize: vertical; border-radius: 0.25rem; border: 1px solid #e2e8f0; background: #fff; padding: 0.5rem 0.75rem; font-size: 0.875rem; }
    .textarea-base:focus { border-color: #60a5fa; outline: none; box-shadow: 0 0 0 1px #60a5fa; }
    .textarea-base:disabled { background: #f8fafc; }
  </style>
</head>
<body class="min-h-screen antialiased">
  <div id="app"></div>
  <script>
    const TEMPLATE_REGISTRY = [{"id":"see-think-wonder","order":0,"name":"See/Think/Wonder","nameEn":"SEE/THINK/WONDER","category":"thinking-routine","description":"관찰·생각·궁금증 기록","headerFields":["unit","period","inquiryQuestion","writingContext"]},{"id":"circle-tree-map","order":1,"name":"써클맵·트리맵","category":"thinking-map","description":"브레인스토밍과 분류","headerFields":["writingContext"]},{"id":"double-bubble-map","order":2,"name":"더블 버블 맵","category":"thinking-map","description":"두 대상 비교·대조","headerFields":["writingContext"]},{"id":"multi-flow-map","order":3,"name":"멀티플로우맵","category":"thinking-map","description":"원인·사건·결과 분석","headerFields":["writingContext"]},{"id":"bridge-map","order":4,"name":"브릿지맵","category":"thinking-map","description":"유추 관계 표현","headerFields":["writingContext"]},{"id":"window-map","order":5,"name":"윈도우맵","category":"thinking-map","description":"9칸 창문 구조 정리","headerFields":["writingContext"]},{"id":"swot","order":6,"name":"SWOT 기법","category":"strategy","description":"강점·약점·기회·위협","headerFields":["writingContext"]},{"id":"think-puzzle-explore","order":7,"name":"Think·Puzzle·Explore","category":"thinking-routine","description":"알고 있는 것·궁금한 점·탐구","headerFields":["writingContext"]},{"id":"hexagon-keywords","order":8,"name":"육각형 핵심 단어 연결하기","category":"thinking-map","description":"키워드와 연결 관계","headerFields":["writingContext"]},{"id":"six-thinking-hats","order":9,"name":"육색 사고 기법","category":"strategy","description":"6가지 관점 아이디어","headerFields":["writingContext","description"]},{"id":"claim-support-question","order":11,"name":"Claim·Support·Question","category":"thinking-routine","description":"주장·근거·질문","headerFields":["writingContext"]},{"id":"five-why","order":12,"name":"5WHY 활동지","category":"strategy","description":"5번의 왜 질문","headerFields":["writingContext"]},{"id":"hot-spots","order":13,"name":"Hot Spots","category":"thinking-routine","description":"사진에서 눈에 띄는 부분","headerFields":["writingContext"]},{"id":"headline","order":14,"name":"Headline","category":"thinking-routine","description":"한 문장 헤드라인","headerFields":["writingContext"]},{"id":"zoom-in","order":15,"name":"Zoom In","category":"thinking-routine","description":"점진적 이미지 확대 추리","headerFields":["writingContext"]},{"id":"chalk-talk","order":16,"name":"Chalk Talk","category":"collaboration","description":"침묵 속 아이디어 공유","headerFields":["writingContext"]},{"id":"gsce","order":17,"name":"Generate·Sort·Connect·Elaborate","category":"thinking-routine","description":"아이디어 생성과 구체화","headerFields":["writingContext"]},{"id":"frayer-model","order":18,"name":"프레이어 모델","category":"thinking-map","description":"개념 정의·속성·예","headerFields":["unit","period","inquiryQuestion","writingContext"]},{"id":"question-types","order":19,"name":"질문의 종류","category":"reflection","description":"사실·개념·호기심 질문","headerFields":["unit","period","inquiryQuestion","writingContext"]},{"id":"question-bank","order":20,"name":"질문은행","category":"reflection","description":"4가지 성찰 질문","headerFields":["description"]},{"id":"circle-of-viewpoints","order":21,"name":"관점의 원","category":"thinking-routine","description":"다양한 관점 탐색","headerFields":["writingContext"]},{"id":"spectrum","order":22,"name":"스펙트럼 입장문","category":"collaboration","description":"입장 스펙트럼 배치","headerFields":["description"]},{"id":"honeycomb-questions","order":23,"name":"벌집 질문","category":"thinking-map","description":"5개 육각형 질문","headerFields":["description"]},{"id":"compass-points","order":24,"name":"나침반 사고 루틴","category":"thinking-routine","description":"Compass Points","headerFields":["description"]},{"id":"plus-one","order":25,"name":"플러스 원","category":"collaboration","description":"Plus One 협력 루틴","headerFields":["description"]},{"id":"stop-light","order":26,"name":"STOP Light","category":"thinking-routine","description":"문제·영향·해결","headerFields":["description"]},{"id":"y-chart","order":27,"name":"Y Chart","category":"thinking-routine","description":"Looks·Sounds·Feels","headerFields":["description"]},{"id":"t-chart","order":28,"name":"T Chart","category":"thinking-routine","description":"알게 된 것·알고 싶은 것","headerFields":["description"]},{"id":"four-cs","order":29,"name":"4C's","category":"thinking-routine","description":"연결·도전·개념·변화","headerFields":["description"]},{"id":"give-3-feedback","order":30,"name":"Give 3 Feedback","category":"reflection","description":"3가지 피드백","headerFields":["description"]},{"id":"ladder-of-feedback","order":31,"name":"Ladder of Feedback","category":"reflection","description":"5단계 피드백 사다리","headerFields":["description"]},{"id":"step-inside","order":32,"name":"Step Inside","category":"thinking-routine","description":"대상 속으로 들어가기","headerFields":["description"]},{"id":"peel-the-fruit","order":33,"name":"Peel the Fruit","category":"thinking-routine","description":"주제 깊이 탐구","headerFields":["description"]},{"id":"i-used-to-think","order":34,"name":"I Used to Think… Now I Think…","category":"reflection","description":"생각의 변화 성찰","headerFields":["description"]},{"id":"mandalart","order":36,"name":"만다라트","category":"strategy","description":"9×9 목표 확장","headerFields":["description"]},{"id":"brainstorming","order":37,"name":"브레인스토밍","category":"collaboration","description":"4가지 원칙 아이디어","headerFields":["description"]},{"id":"brainwriting-635","order":38,"name":"Brainwriting 6-3-5","category":"collaboration","description":"6-3-5 방법","headerFields":["description"]},{"id":"exaggeration","order":39,"name":"과장하기","nameEn":"Exaggeration","category":"strategy","description":"과장 질문 기법","headerFields":["description"]},{"id":"starbursting","order":40,"name":"스타버스팅 (5W1H)","category":"strategy","description":"5W1H 질문 확장","headerFields":["description"]}];
    const CATEGORY_LABELS = {"thinking-routine":"사고 루틴","thinking-map":"생각 지도","strategy":"사고 전략","reflection":"성찰·피드백","collaboration":"협력 활동"};

    const DEFAULT_META = { grade: "", classNo: "", studentNo: "", studentName: "", topic: "", unit: "", period: "", inquiryQuestion: "", writingContext: "", description: "" };
    const FIELD_LABELS = { unit: "단원", period: "차시", inquiryQuestion: "탐구질문", writingContext: "글쓰기 상황", description: "설명" };

    let state = { view: "home", templateId: null, meta: { ...DEFAULT_META }, values: {}, submitted: false };

    function v(values, key) { return values[key] ?? ""; }
    function esc(s) { return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

    function getTemplate(id) { return TEMPLATE_REGISTRY.find(t => t.id === id); }
    function getSortedTemplates() { return [...TEMPLATE_REGISTRY].sort((a,b) => a.order - b.order); }

    function input(key, ph, cls = "input-base", ro) {
      return `<input class="${cls}" placeholder="${esc(ph)}" value="${esc(v(state.values,key))}" ${ro?"disabled":""} data-key="${esc(key)}" />`;
    }
    function ta(key, ph, rows = 4, label, cls = "textarea-base", ro) {
      const lbl = label ? `<label class="mb-1 block text-xs font-semibold text-slate-600">${esc(label)}</label>` : "";
      return `<div class="${cls.includes('flex')?'':''}">${lbl}<textarea class="textarea-base ${cls}" rows="${rows}" placeholder="${esc(ph||'')}" ${ro?"disabled":""} data-key="${esc(key)}">${esc(v(state.values,key))}</textarea></div>`;
    }
    function section(title, color, inner) {
      const colors = { pink:"bg-pink-100 border-pink-200", blue:"bg-blue-100 border-blue-200", green:"bg-green-100 border-green-200", purple:"bg-purple-100 border-purple-200", yellow:"bg-yellow-100 border-yellow-200", orange:"bg-orange-100 border-orange-200" };
      const c = colors[color] || colors.pink;
      return `<div class="overflow-hidden rounded-lg border-2 ${c}"><div class="px-4 py-2 text-sm font-bold text-slate-800 ${c}">${esc(title)}</div><div class="bg-amber-50/30 p-4">${inner}</div></div>`;
    }
    function grid(keys, cols, ro, cellClass = "") {
      return `<div class="grid gap-2" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${keys.map(k=>`<textarea class="textarea-base min-h-[72px] ${cellClass}" data-key="${esc(k)}" ${ro?"disabled":""}>${esc(v(state.values,k))}</textarea>`).join("")}</div>`;
    }

    const TEMPLATE_RENDERERS = {
      "see-think-wonder": () => {
        const cols = [["see","See","관찰한 내용을 적어보세요"],["think","Think","생각과 느낌을 적어보세요"],["wonder","Wonder","궁금한 점을 적어보세요"]];
        return section("See / Think / Wonder","blue", `<div class="grid gap-4 lg:grid-cols-3">${cols.map(([k,t,ph])=>`<div class="rounded-lg border border-slate-200 bg-white p-3"><h3 class="mb-2 text-sm font-bold uppercase text-slate-700">${t}</h3>${ta(k,ph,6,"","",state.submitted)}</div>`).join("")}</div>`);
      },
      "circle-tree-map": () => section("사고하기 — 써클맵, 트리맵","pink", `
        <h4 class="mb-2 text-sm font-bold">1. 써클맵</h4>
        <div class="flex justify-center mb-6"><div class="relative flex h-48 w-48 items-center justify-center rounded-full border-2 border-pink-200 bg-pink-50">
          <textarea class="absolute resize-none rounded-full border border-pink-200 bg-white p-2 text-center text-xs" style="width:60%;height:60%;border-radius:50%" data-key="circleCenter" placeholder="핵심 주제" ${state.submitted?"disabled":""}>${esc(v(state.values,"circleCenter"))}</textarea>
          <textarea class="h-full w-full resize-none rounded-full bg-transparent p-6 text-xs" data-key="circleOuter" placeholder="관련 생각들" ${state.submitted?"disabled":""}>${esc(v(state.values,"circleOuter"))}</textarea>
        </div></div>
        <h4 class="mb-2 text-sm font-bold">2. 트리맵</h4>
        ${ta("treeRoot","",1,"루트 (주제)","mb-3",state.submitted)}
        <div class="grid gap-2 md:grid-cols-3">${[1,2,3].map(n=>`<div class="rounded border border-pink-200 bg-pink-50 p-2">${ta("treeCat"+n,"",1,"분류 "+n,"",state.submitted)}${ta("treeDetail"+n,"세부 예시",3,"","",state.submitted)}</div>`).join("")}</div>`),
      "double-bubble-map": () => section("더블 버블 맵","pink", `<div class="flex flex-col items-center gap-4">
        <div class="flex flex-wrap justify-center gap-2">${["topUnique1","topUnique2","topUnique3"].map(k=>`<textarea class="h-20 w-20 resize-none rounded-full border-2 border-pink-200 bg-pink-50 p-2 text-center text-xs" data-key="${k}" ${state.submitted?"disabled":""}>${esc(v(state.values,k))}</textarea>`).join("")}</div>
        <div class="flex items-center gap-4">${["subjectA","shared1","shared2","subjectB"].map((k,i)=>`<textarea class="${i===0||i===3?"h-24 w-24":"h-16 w-16"} resize-none rounded-full border-2 border-pink-200 bg-pink-50 p-2 text-center text-xs" data-key="${k}" ${state.submitted?"disabled":""}>${esc(v(state.values,k))}</textarea>`).join("")}</div>
        <div class="flex flex-wrap justify-center gap-2">${["bottomUnique1","bottomUnique2","bottomUnique3"].map(k=>`<textarea class="h-20 w-20 resize-none rounded-full border-2 border-pink-200 bg-pink-50 p-2 text-center text-xs" data-key="${k}" ${state.submitted?"disabled":""}>${esc(v(state.values,k))}</textarea>`).join("")}</div></div>`),
      "multi-flow-map": () => {
        const box = k => `<textarea class="min-h-[64px] w-full resize-y rounded border-2 border-pink-200 bg-pink-50 p-2 text-sm" data-key="${k}" ${state.submitted?"disabled":""}>${esc(v(state.values,k))}</textarea>`;
        return section("멀티플로우맵","pink", `<div class="space-y-2"><div class="flex items-center gap-2"><span class="w-8 text-xs font-bold [writing-mode:vertical-lr]">결과</span><div class="grid flex-1 grid-cols-3 gap-2">${[1,2,3].map(n=>box("effect"+n)).join("")}</div></div><div class="flex justify-center py-2">${box("event")}</div><div class="flex items-center gap-2"><span class="w-8 text-xs font-bold [writing-mode:vertical-lr]">원인</span><div class="grid flex-1 grid-cols-3 gap-2">${[1,2,3].map(n=>box("cause"+n)).join("")}</div></div></div>`);
      },
      "bridge-map": () => section("브릿지맵","pink", [1,2,3].map(n=>`<div class="mb-4">${ta("bridgeLabel"+n,"",1,""+n+". 유형","mb-2",state.submitted)}<div class="grid grid-cols-[1fr_auto_1fr] items-center gap-2">${ta("bridgeTop"+n,"위",2,"","",state.submitted)}<div class="text-2xl text-slate-400">⟷</div>${ta("bridgeBottom"+n,"아래 (as)",2,"","",state.submitted)}</div></div>`).join("")),
      "window-map": () => {
        const cell = k => `<textarea class="min-h-[60px] w-full resize-y border border-slate-300 bg-white p-1 text-xs" data-key="${k}" ${state.submitted?"disabled":""}>${esc(v(state.values,k))}</textarea>`;
        return section("윈도우맵","pink", `<div class="relative mx-auto max-w-lg"><div class="grid grid-cols-2 gap-0 border-2 border-slate-400">${["tl","tr","bl","br"].map(k=>"<div>"+cell(k)+"</div>").join("")}</div><div class="absolute left-1/2 top-1/2 z-10 w-16 -translate-x-1/2 -translate-y-1/2 border-2 border-slate-500 bg-white">${cell("center")}</div><div class="mt-2 grid grid-cols-4 gap-1">${["left1","left2","right1","right2"].map(k=>cell(k)).join("")}</div></div>`);
      },
      "swot": () => section("SWOT 기법","pink", `<div class="grid grid-cols-1 gap-2 sm:grid-cols-2">${[["strength","Strength (강점)"],["weakness","Weakness (약점)"],["opportunity","Opportunity (기회)"],["threat","Threat (위협)"]].map(([k,l])=>ta(k,"",5,l,"",state.submitted)).join("")}</div>`),
      "think-puzzle-explore": () => section("Think · Puzzle · Explore","green", `<div class="grid gap-3 md:grid-cols-3">${[["think","Think (생각하기)"],["puzzle","Puzzle (궁금한 점)"],["explore","Explore (탐구하기)"]].map(([k,t])=>`<div class="rounded border border-lime-300 bg-white"><div class="bg-lime-300 px-3 py-2 text-sm font-bold">${t}</div>${ta(k,"",5,"","p-3",state.submitted)}</div>`).join("")}</div>`),
      "hexagon-keywords": () => section("육각형 핵심 단어 연결하기","yellow", `<div class="mx-auto max-w-md"><div class="grid grid-cols-3 gap-1 place-items-center">${[["topLeft",1],["top",2],["topRight",3],["bottomLeft",4],["center",5],["bottomRight",6],["bottom",8]].map(([k])=>`<textarea class="hex-cell resize-none border-2 border-slate-400 bg-white p-2 text-center text-xs" data-key="${k}" ${state.submitted?"disabled":""}>${esc(v(state.values,k))}</textarea>`).join("")}</div></div><p class="my-3 text-xs text-slate-500">알파벳 A~L: 두 단어 사이의 연결을 설명하세요</p><div class="grid grid-cols-3 gap-2 sm:grid-cols-4">${"ABCDEFGHIJKL".split("").map(l=>ta("link_"+l,"",2,l,"",state.submitted)).join("")}</div>${ta("summary","",2,"한 문장으로 정리","mt-3",state.submitted)}`),
      "six-thinking-hats": () => section("육색 사고 기법","purple", `${ta("invention","",1,"발명품 이름","mb-4",state.submitted)}${[["white1","문제 정의 (흰색)"],["yellow","방향 아이디어 (노란색)"],["white2","연구 및 조사 (흰색)"],["red","기능과 특징 (빨간색)"],["blue","설계 및 제작 (파란색)"],["black","위험 및 문제점 (검은색)"],["green","창의적 아이디어 (녹색)"]].map(([k,l])=>ta(k,"",3,l,"mb-2",state.submitted)).join("")}`),
      "claim-support-question": () => section("Claim · Support · Question","pink", `<div class="grid gap-3 md:grid-cols-3">${[["claim","Claim (주장)"],["support","Support (근거)"],["question","Question (질문)"]].map(([k,t])=>`<div class="rounded border-2 border-red-200 bg-white"><div class="bg-pink-100 px-3 py-2 text-sm font-bold">${t}</div>${ta(k,"",6,"","p-3",state.submitted)}</div>`).join("")}</div>`),
      "five-why": () => section("5WHY 활동지","yellow", `${ta("mainTopic","",1,"주제","mb-4",state.submitted)}<div class="space-y-3">${[1,2,3,4,5].map(n=>`<div class="grid gap-2 rounded border border-sky-200 bg-white p-3 md:grid-cols-[60px_1fr_1fr]"><span class="flex items-center text-sm font-bold text-sky-700">${n} why</span>${ta("q"+n,"",2,"질문","",state.submitted)}${ta("a"+n,"",2,"답","",state.submitted)}</div>`).join("")}</div>${ta("conclusion","",3,"결론","mt-4",state.submitted)}`),
      "hot-spots": () => section("Hot Spots","blue", `<p class="mb-3 text-sm text-slate-600">사진에서 눈에 띄는 부분과 궁금한 점을 적어보세요.</p>${[1,2].map(n=>ta("case"+n,"나는 여기가 눈에 띄었어요. 왜냐하면…",4,"활동사례 "+n,"mb-3",state.submitted)).join("")}`),
      "headline": () => section("Headline 활동","blue", `<p class="mb-3 text-sm text-slate-600">오늘 배운 내용을 신문 헤드라인처럼 한 문장으로 정리해보세요.</p>${ta("headline","예: '모인 물방울이 지구를 구한다!'",3,"","",state.submitted)}`),
      "zoom-in": () => section("Zoom In","blue", `<div class="grid gap-3 md:grid-cols-3">${[["step1","1. 작은 이미지 — 이게 뭘까요?"],["step2","2. 조금 더 확대 — 생각을 바꿔야 할까요?"],["step3","3. 전체 이미지 — 처음 생각과 뭐가 다른가요?"]].map(([k,l])=>ta(k,"",5,l,"",state.submitted)).join("")}</div>${ta("writingSituation","",3,"글쓰기 상황","mt-4",state.submitted)}`),
      "chalk-talk": () => section("Chalk Talk","blue", [["writingContext","글쓰기 상황"],["activityExample","활동 사례"],["activityTip","활동 팁"]].map(([k,l])=>ta(k,"",4,l,"mb-3",state.submitted)).join("")),
      "gsce": () => section("Generate · Sort · Connect · Elaborate","blue", `<div class="grid gap-3 sm:grid-cols-2">${[["generate","Generate — 아이디어 떠올리기"],["sort","Sort — 아이디어 분류하기"],["connect","Connect — 아이디어 연결하기"],["elaborate","Elaborate — 아이디어 확장하기"]].map(([k,l])=>`<div class="rounded border-2 border-blue-300 bg-white p-2">${ta(k,"",5,l,"",state.submitted)}</div>`).join("")}</div>${ta("writingContext","",3,"글쓰기 상황","mt-3",state.submitted)}${ta("activityCase","",3,"활동 사례","mt-3",state.submitted)}`),
      "frayer-model": () => section("프레이어 모델","pink", `<div class="relative grid grid-cols-2 gap-0 rounded border-2 border-orange-200 bg-orange-50">${[["definition","정의"],["characteristics","속성"],["examples","예"],["nonExamples","예가 아닌 것"]].map(([k,l])=>`<div class="border border-orange-200 p-2 pt-6"><span class="text-xs font-bold text-slate-600">${l}</span>${ta(k,"",4,"","mt-1",state.submitted)}</div>`).join("")}<div class="absolute left-1/2 top-1/2 z-10 w-28 -translate-x-1/2 -translate-y-1/2 rounded border-2 border-slate-400 bg-white p-2 text-center"><span class="text-xs font-bold">개념</span><textarea class="mt-1 w-full resize-none text-xs" rows="2" data-key="concept" ${state.submitted?"disabled":""}>${esc(v(state.values,"concept"))}</textarea></div></div>`),
      "question-types": () => section("질문의 종류","green", `${ta("inquiry","",2,"탐구질문","mb-3",state.submitted)}${ta("aiPrompt","",2,"AI 활용 (프롬프트)","mb-3",state.submitted)}<div class="grid gap-3 md:grid-cols-3">${[["fact","사실 질문"],["concept","개념 질문"],["curiosity","호기심 질문"]].map(([k,l])=>ta(k,"",4,l,"",state.submitted)).join("")}</div>${ta("expected","",3,"예상답","mt-3",state.submitted)}`),
      "question-bank": () => {
        const sections = [
          { key:"self", title:"자신에 대한 성찰", qs:["나의 강점과 약점은?","학습 목표 달성 정도는?","참여 태도는?","가장 흥미로웠던 순간은?","어떤 점에서 성장했는가?"] },
          { key:"process", title:"탐구과정 성찰", qs:["새롭게 배운 것은?","어려움과 극복 방법은?","탐구 방법의 효과는?","더 깊이 생각할 부분은?"] },
          { key:"concept", title:"학습한 개념", qs:["가장 중요한 개념은?","실생활 적용 방법은?","다른 교과와의 연결은?","사고방식의 변화는?","다른 사람에게 설명할 수 있는가?"] },
          { key:"generalize", title:"일반화", qs:["더 넓은 맥락에서의 적용은?","실생활 문제 해결 방법은?","미래 학습·직업에서의 중요성은?"] },
        ];
        return `<div class="space-y-4">${sections.map(({key,title,qs})=>section(title,"green",qs.map((q,i)=>ta(key+"_"+i,"",2,q,"mb-2",state.submitted)).join(""))).join("")}</div>`;
      },
      "circle-of-viewpoints": () => section("관점의 원","orange", `${ta("centerTopic","",1,"중심 주제","mb-4",state.submitted)}${ta("viewpoint","",2,"1. 관점 정하기 — I am thinking from the point of view of…","mb-2",state.submitted)}${ta("think","",3,"2. I think… Because…","mb-2",state.submitted)}${ta("concern","",3,"3. A question or concern from this viewpoint…","",state.submitted)}`),
      "spectrum": () => section("스펙트럼 입장문","yellow", `${ta("question","",2,"질문/주제","mb-4",state.submitted)}<div class="relative mb-6 flex items-center justify-between rounded bg-slate-100 px-4 py-8"><span>←</span>${["전혀 아니다","아니다","그렇다","매우 그렇다"].map(l=>`<span class="rounded bg-yellow-200 px-2 py-1 text-xs font-medium">${l}</span>`).join("")}<span>→</span></div>${[["notAtAll","전혀 아니다 — 나의 생각"],["no","아니다 — 나의 생각"],["yes","그렇다 — 나의 생각"],["veryYes","매우 그렇다 — 나의 생각"]].map(([k,l])=>ta(k,"",2,l,"mb-2",state.submitted)).join("")}${ta("reflection","",3,"종합 성찰","mt-3",state.submitted)}`),
      "honeycomb-questions": () => section("벌집 질문","yellow", `<div class="mx-auto grid max-w-sm grid-cols-3 gap-1 place-items-center">${["left1","left2","center","right1","right2"].map((k,i)=>`<textarea class="hex-cell border-2 border-slate-800 p-2 text-xs ${k==='center'?'col-start-2 row-span-2 row-start-1 self-center':''}" data-key="${k}" ${state.submitted?"disabled":""}>${esc(v(state.values,k))}</textarea>`).join("")}</div>${ta("summary","",4,"종합","mt-4",state.submitted)}`),
      "compass-points": () => section("Compass Points","pink", `<div class="relative mx-auto aspect-square max-w-md border-2 border-pink-300"><div class="absolute inset-0 grid grid-cols-2 grid-rows-2">${[["needToKnow","NEED TO KNOW"],["excited","EXCITED"],["worries","WORRIES"],["steps","STEPS"]].map(([k,ph])=>`<textarea class="resize-none border border-pink-200 p-2 text-xs" placeholder="${ph}" data-key="${k}" ${state.submitted?"disabled":""}>${esc(v(state.values,k))}</textarea>`).join("")}</div><div class="pointer-events-none absolute left-1/2 top-1/2 h-8 w-8 -translate-x-1/2 -translate-y-1/2 rounded-full bg-pink-400"></div></div>${ta("notes","",3,"추가 메모","mt-4",state.submitted)}`),
      "plus-one": () => section("Plus One (플러스 원)","purple", `<div class="grid gap-4 lg:grid-cols-[1fr_280px]">${ta("workspace","생각을 자유롭게 기록하세요",12,"","",state.submitted)}<div class="space-y-2">${[["recall","RECALL — 기억나는 핵심 내용"],["addOne","PASS RIGHT & ADD 1 — 하나 추가하기"],["repeat","REPEAT — 2번 이상 반복"],["review","REVIEW — 다른 사람의 추가 검토"],["reflect","REFLECT — 성찰"]].map(([k,l])=>`<div class="rounded border border-slate-200 bg-white p-2"><p class="text-xs font-bold text-slate-700">${l}</p>${k==="reflect"?ta("reflect","",3,"","mt-1",state.submitted):""}</div>`).join("")}</div></div>`),
      "stop-light": () => section("STOP Light","pink", `<div class="grid gap-3 md:grid-cols-3">${[["problem","WHAT ARE THE PROBLEMS?","bg-red-100"],["affect","WHO DO THEY AFFECT?","bg-yellow-100"],["solution","WHAT ARE SOME SOLUTIONS?","bg-green-100"]].map(([p,l,bg])=>`<div><p class="mb-2 text-xs font-bold">${l}</p>${grid(Array.from({length:6},(_,i)=>p+"_"+i),2,state.submitted,bg)}</div>`).join("")}</div>${ta("notes","",3,"추가 메모","mt-4",state.submitted)}`),
      "y-chart": () => section("Y Chart","purple", `<div class="grid gap-3 md:grid-cols-3">${[["looks","Looks like (보이는 것)"],["sounds","Sounds like (들리는 것)"],["feels","Feels like (느껴지는 것)"]].map(([k,l])=>ta(k,"",5,l,"",state.submitted)).join("")}</div>${ta("notes","",3,"추가 메모","mt-3",state.submitted)}`),
      "t-chart": () => section("T Chart","pink", `<div class="grid gap-3 md:grid-cols-2">${ta("know","",8,"What I Know (알게 된 것)","",state.submitted)}${ta("want","",8,"What I Want to Know (알고 싶은 것)","",state.submitted)}</div>`),
      "four-cs": () => section("The 4 C's","blue", `<div class="grid gap-3 sm:grid-cols-2">${[["connections","Connections (연결)"],["challenge","Challenge (도전)"],["concepts","Concepts (개념)"],["changes","Changes (변화)"]].map(([k,l])=>ta(k,"",4,l,"",state.submitted)).join("")}</div>`),
      "give-3-feedback": () => section("Give 3 Feedback Routine","blue", [1,2,3].map(n=>ta("feedback"+n,"",3,"피드백 "+n,"mb-3",state.submitted)).join("")),
      "ladder-of-feedback": () => section("Ladder of Feedback","pink", `<div class="space-y-2">${[["clarify","Clarify (명확히)","bg-red-200"],["value","Value (가치)","bg-purple-200"],["concerns","Questions & Concerns","bg-blue-200"],["suggest","Suggest (제안)","bg-green-200"],["thank","Thank (감사)","bg-yellow-200"]].map(([k,l,bg])=>`<div class="rounded-lg border border-slate-200 ${bg} p-1">${ta(k,"",2,l,"bg-white/80 p-2 rounded",state.submitted)}</div>`).join("")}</div>`),
      "step-inside": () => section("Step Inside","orange", [["see","What can this person or thing see, observe, or notice?"],["know","What might they know, understand, hold true, or believe?"],["care","What might they care deeply about?"],["wonder","What might they wonder about or question?"]].map(([k,q])=>ta(k,"",3,q,"mb-3",state.submitted)).join("")),
      "peel-the-fruit": () => section("Peel the Fruit","orange", `<div class="grid gap-3 md:grid-cols-2">${[["outside","Outside Skin — 무엇이 보이나요?"],["under","Under the Skin — 궁금한 점은?"],["building","Building Explanations — 진짜 무엇에 관한 것?"],["connection","Making a Connection — 내 삶과의 연결?"],["viewpoints","Different Viewpoints — 다른 관점은?"],["heart","Capturing the Heart — 핵심 메시지는?"]].map(([k,l])=>ta(k,"",4,l,"",state.submitted)).join("")}</div>`),
      "i-used-to-think": () => section("I Used to Think… Now I Think…","yellow", `${ta("usedToThink","",5,"I used to think… (예전에는…)","mb-4",state.submitted)}${ta("nowThink","",5,"Now I think… (지금은…)","",state.submitted)}`),
      "mandalart": () => {
        const blocks = Array.from({length:9}, (_, blockIdx) => {
          const cells = Array.from({length:9}, (_, i) => {
            const isMid = i === 4;
            let key, disabled = state.submitted;
            if (blockIdx === 4) { key = ["detail_0","detail_1","detail_2","detail_3","center","detail_4","detail_5","detail_6","detail_7"][i]; }
            else if (isMid) { key = "detail_" + [0,1,2,3,4,5,6,7][blockIdx > 4 ? blockIdx - 1 : blockIdx]; disabled = true; }
            else { key = "block_" + blockIdx + "_" + i; }
            return `<textarea class="min-h-[32px] resize-none border-0 p-0.5 text-[9px] sm:min-h-[40px] sm:text-[10px] ${isMid?"bg-slate-800 font-bold text-white":"bg-white"}" data-key="${key}" ${disabled?"disabled":""}>${esc(v(state.values,key))}</textarea>`;
          }).join("");
          return `<div class="grid grid-cols-3 gap-px bg-slate-300">${cells}</div>`;
        }).join("");
        return section("만다라트","pink", `<div class="overflow-x-auto"><div class="mx-auto grid w-max grid-cols-3 gap-1">${blocks}</div></div><p class="mt-2 text-xs text-slate-500">중앙 3×3의 세부 주제가 바깥 3×3 중심에 자동 연결됩니다.</p>`);
      },
      "brainstorming": () => section("브레인스토밍","pink", `<div class="mb-4 rounded bg-slate-50 p-3 text-xs text-slate-600"><p class="font-bold">4가지 원칙: 자유로운 분위기 · 질보다 양 · 비판금지 · 결합과 개선</p></div><div class="grid gap-3 md:grid-cols-2">${ta("idea1","",5,"아이디어 1","",state.submitted)}${ta("idea2","",5,"아이디어 2","",state.submitted)}</div>${ta("summary","",4,"종합","mt-3",state.submitted)}`),
      "brainwriting-635": () => section("Brainwriting 6-3-5 Method","purple", `${ta("issue","",2,"Issue (문제)","mb-3",state.submitted)}<p class="mb-2 text-xs text-slate-500">6명 × 3아이디어 × 6라운드</p>${grid(Array.from({length:18},(_,i)=>"cell_"+i),3,state.submitted)}<div class="mt-3 grid gap-3 md:grid-cols-3">${[["connect","Connect/Combine"],["cluster","Cluster"],["evaluate","Evaluate"]].map(([k,l])=>ta(k,"",3,l,"",state.submitted)).join("")}</div>`),
      "exaggeration": () => section("과장하기 Exaggeration","blue", `${ta("content","과장된 질문과 아이디어를 적어보세요",8,"","mt-3",state.submitted)}`),
      "starbursting": () => section("스타버스팅 (5W1H)","blue", `<div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">${[["who","Who (누가)"],["what","What (무엇)"],["when","When (언제)"],["where","Where (어디)"],["why","Why (왜)"],["how","How (어떻게)"]].map(([k,l])=>ta(k,"",3,l,"",state.submitted)).join("")}</div>`),
    };

    function renderHeader(template) {
      const fields = template.headerFields || ["writingContext"];
      const ro = state.submitted;
      const metaInput = (key, ph, cls) => `<input class="input-base ${cls}" placeholder="${ph}" value="${esc(state.meta[key]||'')}" data-meta="${key}" ${ro?"disabled":""} />`;
      const extraRows = fields.map(f => `<div class="grid grid-cols-1 border-b border-slate-200 last:border-b-0 md:grid-cols-[120px_1fr]"><div class="bg-sky-50 px-3 py-2 text-xs font-semibold text-slate-600">${FIELD_LABELS[f]}</div><textarea class="min-h-[48px] resize-y px-3 py-2 text-sm focus:outline-none" rows="${f==='writingContext'||f==='description'?2:1}" placeholder="${FIELD_LABELS[f]}을(를) 입력하세요" data-meta="${f}" ${ro?"disabled":""}>${esc(state.meta[f]||'')}</textarea></div>`).join("");
      return `<div class="overflow-hidden rounded-lg border border-slate-300 bg-white shadow-sm">
        <div class="grid grid-cols-1 border-b border-slate-200 md:grid-cols-[120px_1fr_200px]">
          <div class="bg-sky-50 px-3 py-2 text-xs font-semibold text-slate-600">사고도구</div>
          <div class="border-slate-200 px-3 py-2 text-sm font-bold text-slate-800 md:border-x">${esc(template.name)}</div>
          <div class="flex flex-wrap items-center gap-1 bg-sky-50 px-3 py-2 text-xs">
            <span class="font-semibold text-slate-600">학반</span>
            ${metaInput("grade","반","w-12")}${metaInput("studentNo","번","w-12")}${metaInput("studentName","이름","flex-1 min-w-[60px]")}
          </div>
        </div>
        <div class="grid grid-cols-1 border-b border-slate-200 md:grid-cols-[120px_1fr]">
          <div class="bg-sky-50 px-3 py-2 text-xs font-semibold text-slate-600">주제</div>
          ${metaInput("topic","주제를 입력하세요","px-3 py-2 text-sm focus:outline-none border-0 shadow-none")}
        </div>
        ${extraRows}
      </div>`;
    }

    function renderHome() {
      const templates = getSortedTemplates();
      const categories = [...new Set(templates.map(t => t.category))];
      return `<div class="min-h-screen">
        <header class="border-b border-slate-200 bg-white">
          <div class="mx-auto max-w-6xl px-4 py-8">
            <h1 class="text-2xl font-bold text-slate-900 sm:text-3xl">사고도구 톡톡</h1>
            <p class="mt-2 text-slate-600">사고 전략 기법 활동지 · ${templates.length}개 템플릿</p>
          </div>
        </header>
        <main class="mx-auto max-w-6xl px-4 py-8">
          ${categories.map(cat => {
            const items = templates.filter(t => t.category === cat);
            return `<section class="mb-10"><h2 class="mb-4 text-lg font-bold text-slate-800">${CATEGORY_LABELS[cat]||cat}<span class="ml-2 text-sm font-normal text-slate-400">(${items.length})</span></h2>
            <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">${items.map(t => `<a href="#/templates/${t.id}" class="group rounded-xl border border-slate-200 bg-white p-4 shadow-sm transition hover:border-blue-300 hover:shadow-md block">
              <div class="flex items-start justify-between gap-2"><h3 class="font-semibold text-slate-800 group-hover:text-blue-700">${esc(t.name)}</h3><span class="shrink-0 rounded bg-slate-100 px-2 py-0.5 text-xs text-slate-500">${t.order}</span></div>
              <p class="mt-1 text-sm text-slate-500">${esc(t.description)}</p></a>`).join("")}</div></section>`;
          }).join("")}
        </main>
      </div>`;
    }

    function renderTemplate() {
      const template = getTemplate(state.templateId);
      if (!template) return `<div class="p-8 text-center text-red-600">템플릿을 찾을 수 없습니다.</div>`;
      const renderer = TEMPLATE_RENDERERS[template.id];
      const body = renderer ? renderer() : `<div class="rounded-lg border border-red-200 bg-red-50 p-6 text-center text-red-600">템플릿 UI 준비 중: ${esc(template.id)}</div>`;
      return `<div class="mx-auto max-w-5xl space-y-4 px-4 py-6">
        <div class="flex items-center justify-between">
          <a href="#/" class="text-sm text-blue-600 hover:underline">← 템플릿 목록</a>
          <span class="rounded-full bg-slate-100 px-3 py-1 text-xs text-slate-500">#${template.order}</span>
        </div>
        ${renderHeader(template)}
        ${body}
        <div class="flex justify-end gap-3 pt-4">
          <button type="button" id="btn-edit" class="rounded-lg border border-slate-300 px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">다시 수정</button>
          <button type="button" id="btn-submit" class="rounded-lg bg-blue-600 px-6 py-2 text-sm font-medium text-white hover:bg-blue-700">제출하기</button>
        </div>
        ${state.submitted ? '<p class="text-center text-sm text-green-600">제출 완료! (Firebase 연동 후 실제 저장됩니다)</p>' : ''}
      </div>`;
    }

    function render() {
      const app = document.getElementById("app");
      app.innerHTML = state.view === "home" ? renderHome() : renderTemplate();
      bindEvents();
    }

    function bindEvents() {
      document.querySelectorAll("[data-key]").forEach(el => {
        el.oninput = e => { state.values[e.target.dataset.key] = e.target.value; };
      });
      document.querySelectorAll("[data-meta]").forEach(el => {
        el.oninput = e => { state.meta[e.target.dataset.meta] = e.target.value; };
      });
      const edit = document.getElementById("btn-edit");
      const submit = document.getElementById("btn-submit");
      if (edit) edit.onclick = () => { state.submitted = false; render(); };
      if (submit) submit.onclick = () => { state.submitted = true; render(); };
    }

    function route() {
      const hash = location.hash.replace(/^#/, "") || "/";
      const m = hash.match(/^\/templates\/(.+)$/);
      if (m) {
        state.view = "template";
        state.templateId = decodeURIComponent(m[1]);
        if (!getTemplate(state.templateId)) { state.view = "home"; state.templateId = null; }
      } else {
        state.view = "home";
        state.templateId = null;
        state.submitted = false;
      }
      render();
    }

    window.addEventListener("hashchange", route);
    route();
  </script>
</body>
</html>
